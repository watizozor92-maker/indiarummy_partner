<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>库存授权 - 渠道游戏运营中心</title><link rel="stylesheet" href="/static/vendor/layui/css/layui.css"><link rel="stylesheet" href="/static/css/partner.css"></head><body class="partner-app-page">{include file="common/topbar" /}<div class="partner-app-shell">{include file="common/sidebar" /}<main class="partner-main">
<div class="partner-page-title"><div><p class="partner-eyebrow">INVENTORY GRANTS</p><h1>库存授权</h1></div><span class="partner-status"><i></i>平台管理员专属</span></div>
<div class="partner-inline-alert">库存权限按商户授权，可进一步限定游戏、币种、直接调整额度和有效期。未授权商户不会显示库存菜单。</div>
<section class="partner-content-card"><form id="grant-form" class="partner-detail-panel"><label class="partner-label">商户</label><select id="channelId" class="layui-input" required></select><div class="partner-detail-row"><label>显示级别<select class="layui-input" name="visibility"><option value="none">不可见</option><option value="summary">只看概况</option><option value="full">完整库存</option></select></label><label>调整模式<select class="layui-input" name="adjustMode"><option value="none">禁止调整</option><option value="request">仅申请审批</option><option value="direct">额度内直接调整</option></select></label></div><label class="partner-detail-row"><span><b>允许查看库存流水</b><small>商户只能看到自己授权范围内的流水</small></span><input type="checkbox" name="canViewLedger" value="1"></label><div class="partner-detail-row"><label>游戏范围<input class="layui-input" name="gameIds" placeholder="留空=全部；例如 419,635"></label><label>币种范围<input class="layui-input" name="currencyCodes" placeholder="留空=全部；例如 CNY,USD"></label></div><div class="partner-detail-row"><label>单次直接调整上限<input class="layui-input" type="number" min="0" step="0.0001" name="singleLimit" value="0"></label><label>单库存账户每日上限<input class="layui-input" type="number" min="0" step="0.0001" name="dailyLimit" value="0"></label></div><div class="partner-detail-row"><label>授权到期时间<input class="layui-input" type="datetime-local" name="expiresAt"></label><label>授权状态<select class="layui-input" name="status"><option value="1">启用</option><option value="0">停用</option></select></label></div><button class="layui-btn partner-primary-btn">保存库存授权</button></form></section>
</main></div><script src="/static/vendor/layui/layui.js"></script><script>
const form=document.getElementById('grant-form'),select=document.getElementById('channelId');let csrf='';
async function init(){const [m,s]=await Promise.all([fetch('/api/v1/merchants/options').then(r=>r.json()),fetch('/api/v1/session').then(r=>r.json())]);csrf=s.data.csrfToken;select.innerHTML='<option value="">请选择商户</option>'+m.data.map(x=>`<option value="${x.id}">${x.show_name||x.agency_uid} (#${x.id})</option>`).join('');const selected=new URLSearchParams(location.search).get('channelId');if(selected){select.value=selected;loadGrant();}}
async function loadGrant(){if(!select.value)return;const p=await fetch(`/api/v1/merchants/${select.value}/inventory-grant`).then(r=>r.json());if(p.code!=='OK')return layui.layer.msg(p.message);const x=p.data;form.visibility.value=x.visibility;form.adjustMode.value=x.adjustMode;form.canViewLedger.checked=!!x.canViewLedger;form.gameIds.value=(x.gameIds||[]).join(',');form.currencyCodes.value=(x.currencyCodes||[]).join(',');form.singleLimit.value=x.singleLimit;form.dailyLimit.value=x.dailyLimit;form.expiresAt.value=x.expiresAt?x.expiresAt.replace(' ','T').slice(0,16):'';form.status.value=String(x.status);}
select.addEventListener('change',loadGrant);form.addEventListener('submit',async e=>{e.preventDefault();if(!select.value)return layui.layer.msg('请选择商户');const data=new FormData(form),body=new URLSearchParams();for(const [k,v] of data.entries())body.set(k,v);if(!data.has('canViewLedger'))body.set('canViewLedger','0');const p=await fetch(`/api/v1/merchants/${select.value}/inventory-grant`,{method:'PUT',headers:{'X-CSRF-Token':csrf},body}).then(r=>r.json());if(p.code!=='OK')return layui.layer.msg(p.message);csrf=p.data.csrfToken;layui.layer.msg('库存授权已保存');loadGrant();});init();
</script></body></html>
