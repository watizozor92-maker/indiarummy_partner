<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>库存总览 - 渠道游戏运营中心</title><link rel="stylesheet" href="/static/vendor/layui/css/layui.css"><link rel="stylesheet" href="/static/css/partner.css"><style>.partner-badge.scene{color:#7a4b00;background:#fff5d8}</style></head>
<body class="partner-app-page">{include file="common/topbar" /}<div class="partner-app-shell">{include file="common/sidebar" /}<main class="partner-main">
<div class="partner-page-title"><div><p class="partner-eyebrow">INVENTORY</p><h1>库存总览</h1></div><span class="partner-status"><i></i>按商户、游戏、币种隔离</span></div>
<div class="partner-inline-alert">可用库存已扣除活动预算、活动预留和待结算负债；“当前场景”是运行端按账户此刻库存及动态门槛计算的基础匹配，具体玩家的活动、新手或点控可能在开局时覆盖，流水记录每局最终实际命中的场景。</div>
<section class="partner-content-card partner-filter-card"><form id="filters" class="partner-filter-grid compact"><label>商户<select id="channelId" class="layui-select" {$identity.role_code == 'platform_admin' ? '' : 'disabled'}></select></label><label>游戏 ID<input class="layui-input" name="gameId"></label><label>币种<input class="layui-input" name="currencyCode" placeholder="如 CNY"></label><button class="layui-btn partner-primary-btn">查询</button></form></section>
<section id="summary" class="partner-summary-grid"></section>
<section class="partner-content-card"><div class="partner-card-heading"><div><strong>库存账户</strong><small>库存健康度按可用库存 / 目标库存计算</small></div><span id="count">--</span></div><div class="partner-table-wrap"><table class="partner-table"><thead><tr><th>商户</th><th>游戏 / 币种</th><th>当前场景</th><th>可用库存</th><th>真实 / 目标</th><th>已承诺金额</th><th>健康度</th><th>更新时间</th><th>操作</th></tr></thead><tbody id="body"></tbody></table></div></section>
</main></div><script src="/static/vendor/layui/layui.js"></script><script>
const isPlatform={$identity.role_code == 'platform_admin' ? 'true':'false'},ownChannel={$identity.channel_id};
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const money=v=>Number(v||0).toLocaleString('zh-CN',{useGrouping:false,minimumFractionDigits:2,maximumFractionDigits:4});
const channelName=x=>Number(x.channel_id)===0?'平台默认':(x.show_name||x.agency_uid||('channel '+x.channel_id));
const healthName={healthy:'正常',warning:'预警',danger:'危险',unconfigured:'未配置'};let rows=[];
const sceneName={stable:'均衡',normal:'普通',conservative:'保守',inventory_protect:'库存保护',payout_recovery:'派彩恢复',experience:'体验扶持',newbie:'新手扶持',giveaway:'活动赠送'};
function sceneCell(x){if(x.scene_status==='unavailable')return '<span class="partner-badge off">运行端离线</span><small>暂无法实时判定</small>';if(x.scene_status==='unconfigured')return '<span class="partner-badge off">未配置</span><small>无可用调控方案</small>';const name=x.current_scene?(sceneName[x.current_scene]||x.current_scene):'待匹配';return `<span class="partner-badge ${x.current_scene==='stable'?'ok':'scene'}">${esc(name)}</span><small>${x.scene_inherited?'平台默认方案':'商户方案'}${x.current_scene?` · ${esc(x.current_scene)}`:''}</small>`;}
const metric=v=>v==null?'--':Number(v).toLocaleString('zh-CN',{useGrouping:false,minimumFractionDigits:2,maximumFractionDigits:4});
const ratio=v=>v==null?'--':`${(Number(v)*100).toFixed(2)}%`;
function sceneCondition(x){const c=x.scene_condition||{},parts=[];if(c.inventoryRatioMin!=null)parts.push(`库存比例 ≥ ${ratio(c.inventoryRatioMin)}`);if(c.inventoryRatioMax!=null)parts.push(`库存比例 < ${ratio(c.inventoryRatioMax)}`);if(c.experienceScoreMin!=null)parts.push(`体验分 ≥ ${metric(c.experienceScoreMin)}`);if(c.experienceScoreMax!=null)parts.push(`体验分 < ${metric(c.experienceScoreMax)}`);if(c.default||!parts.length)parts.push('兜底场景：更高优先级条件均未命中');return parts.join(' 且 ');}
function sceneFormula(x){if(x.scene_status!=='active'||!x.scene_metrics)return '<div class="partner-inline-alert">运行端没有返回可计算的场景参数。</div>';const m=x.scene_metrics||{},experience=m.experienceScore==null?'当前账号无权查看体验参数':`体验分 = 体验预算 ÷ 风险单位 = ${metric(m.experienceBudget)} ÷ ${metric(m.riskUnit)} = ${metric(m.experienceScore)}`,inventoryRatio=Number(m.targetReserve)>0?`库存比例 = 有效库存 ÷ 目标库存 = ${metric(m.effectiveReserve)} ÷ ${metric(m.targetReserve)} = ${ratio(m.inventoryRatio)}`:`库存比例：目标库存未配置，运行端按 ${ratio(m.inventoryRatio)} 处理`;return `<div class="partner-inline-alert"><strong>场景判定关系</strong><br>有效库存 = 真实库存 - 活动可用预算 - 活动预留 - 待结算负债 = ${metric(m.effectiveReserve)}<br>${inventoryRatio}<br>${experience}<br>命中条件：${esc(sceneCondition(x))}${x.scene_priority!=null?`（优先级 ${esc(x.scene_priority)}）`:''}<br><small>系统按优先级从高到低检查，首个满足条件的场景即为当前基础场景。</small></div>`;}
async function init(){const s=document.getElementById('channelId');if(isPlatform){const p=await fetch('/api/v1/merchants/options').then(r=>r.json());s.innerHTML='<option value="">全部商户</option>'+p.data.map(x=>`<option value="${x.id}">${esc(x.show_name||x.agency_uid)} (#${x.id})</option>`).join('');}else{s.innerHTML=`<option value="${ownChannel}">当前商户 #${ownChannel}</option>`;}load();}
async function load(){const q=new URLSearchParams(new FormData(document.getElementById('filters'))),channel=document.getElementById('channelId').value;if(channel)q.set('channelId',channel);const p=await fetch('/api/v1/inventory/overview?'+q).then(r=>r.json());if(p.code!=='OK')return layui.layer.msg(p.message);rows=p.data;document.getElementById('count').textContent=`共 ${rows.length} 个库存账户`;const total=rows.length,danger=rows.filter(x=>x.health_status==='danger').length,warning=rows.filter(x=>x.health_status==='warning').length;document.getElementById('summary').innerHTML=[['库存账户',total],['危险',danger],['预警',warning]].map(x=>`<article><span>${x[0]}</span><strong>${x[1]}</strong><small>当前筛选范围</small></article>`).join('');document.getElementById('body').innerHTML=rows.length?rows.map((x,i)=>{const committed=Number(x.campaign_available||0)+Number(x.campaign_reserved||0)+Number(x.pending_liability||0),ratio=x.health_ratio==null?'--':(Number(x.health_ratio)*100).toFixed(2)+'%',access=x.inventory_access||{};return `<tr><td>${esc(channelName(x))}<small>#${x.channel_id}</small></td><td><strong>${esc(x.title||x.game_id)}</strong><small>ID ${x.game_id} · ${esc(x.currency_code)}</small></td><td>${sceneCell(x)}</td><td><strong>${money(x.available_reserve)}</strong></td><td>${money(x.cash_reserve)}<small>目标 ${money(x.target_reserve)}</small></td><td>${money(committed)}<small>负债 ${money(x.pending_liability)}</small></td><td><span class="partner-badge ${x.health_status==='healthy'?'ok':'off'}">${healthName[x.health_status]||x.health_status}</span><small>${ratio}</small></td><td>${esc(x.update_time||'-')}</td><td><button class="layui-btn layui-btn-primary layui-btn-xs" onclick="detail(${i})">详情</button>${access.canViewLedger?`<a class="layui-btn layui-btn-primary layui-btn-xs" href="/inventory/ledger?gameId=${x.game_id}&currencyCode=${esc(x.currency_code)}">流水</a>`:''}${access.canAdjust&&Number(x.channel_id)>0?`<button class="layui-btn layui-btn-xs" onclick="adjust(${i})">调整</button>`:''}</td></tr>`}).join(''):'<tr><td colspan="9" class="partner-empty">暂无库存数据</td></tr>';}
function detail(i){const x=rows[i],full=x.inventory_access.visibility==='full';layui.layer.open({type:1,title:`库存详情 · ${esc(x.title||x.game_id)} / ${esc(x.currency_code)}`,area:['780px','680px'],content:`<div class="partner-detail-panel"><div class="partner-detail-row"><b>当前场景</b><span>${sceneCell(x)}</span><b>判定依据</b><span>账户库存与动态门槛（基础匹配）</span></div>${sceneFormula(x)}<div class="partner-detail-row"><b>真实库存</b><span>${money(x.cash_reserve)}</span><b>可用库存</b><span>${money(x.available_reserve)}</span></div><div class="partner-detail-row"><b>目标库存</b><span>${money(x.target_reserve)}</span><b>待结算负债</b><span>${money(x.pending_liability)}</span></div>${full?`<div class="partner-detail-row"><b>活动可用 / 预留</b><span>${money(x.campaign_available)} / ${money(x.campaign_reserved)}</span><b>体验预算 / 已预留</b><span>${money(x.experience_budget)} / ${money(x.assist_reserved)}</span></div><div class="partner-detail-row"><b>已确认利润</b><span>${money(x.realized_profit)}</span><b>本周期投注 / 派彩</b><span>${money(x.period_bet)} / ${money(x.period_payout)}</span></div>`:''}<p>版本 ${x.version} · 更新时间 ${esc(x.update_time)}</p></div>`});}
async function adjust(i){const x=rows[i],a=x.inventory_access,token=await fetch('/api/v1/session').then(r=>r.json()).then(p=>p.data.csrfToken);layui.layer.open({type:1,title:`调整库存 · ${esc(x.title||x.game_id)} / ${esc(x.currency_code)}`,area:['640px','560px'],content:`<form id="adjust-form" class="partner-detail-panel"><div class="partner-inline-alert">当前真实库存 ${money(x.cash_reserve)}。${a.adjustMode==='request'?'提交后由平台管理员审批。':'授权额度内可直接生效，超出额度自动转为审批申请。'}</div><label class="partner-label">调整类型</label><select class="layui-input" name="adjustmentType"><option value="topup">补充库存</option><option value="withdraw">提取库存</option></select><label class="partner-label">金额</label><input class="layui-input" type="number" min="0.0001" step="0.0001" name="amount" required><label class="partner-label">操作原因</label><textarea class="layui-textarea" name="reason" minlength="5" maxlength="255" required></textarea><input type="hidden" name="channelId" value="${x.channel_id}"><input type="hidden" name="gameId" value="${x.game_id}"><input type="hidden" name="currencyCode" value="${esc(x.currency_code)}"><button class="layui-btn partner-primary-btn">提交</button></form>`,success:()=>document.getElementById('adjust-form').addEventListener('submit',async e=>{e.preventDefault();const body=new URLSearchParams(new FormData(e.target));body.set('requestKey',crypto.randomUUID());const p=await fetch('/api/v1/inventory/adjustments',{method:'POST',headers:{'X-CSRF-Token':token},body}).then(r=>r.json());if(p.code!=='OK')return layui.layer.msg(p.message);layui.layer.closeAll();layui.layer.msg(p.message);load();})});}
document.getElementById('filters').addEventListener('submit',e=>{e.preventDefault();load()});init();
</script></body></html>
