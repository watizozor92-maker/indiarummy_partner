<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>库存总览 - 渠道游戏运营中心</title><link rel="stylesheet" href="/static/vendor/layui/css/layui.css"><link rel="stylesheet" href="/static/css/partner.css"></head>
<body class="partner-app-page">{include file="common/topbar" /}<div class="partner-app-shell">{include file="common/sidebar" /}<main class="partner-main">
<div class="partner-page-title"><div><p class="partner-eyebrow">INVENTORY</p><h1>库存总览</h1></div><span class="partner-status"><i></i>按商户、游戏、币种隔离</span></div>
<div class="partner-inline-alert">可用库存已扣除活动预算、活动预留和待结算负债；不同币种不会合并计算。</div>
<section class="partner-content-card partner-filter-card"><form id="filters" class="partner-filter-grid compact"><label>商户<select id="channelId" class="layui-select" {$identity.role_code == 'platform_admin' ? '' : 'disabled'}></select></label><label>游戏 ID<input class="layui-input" name="gameId"></label><label>币种<input class="layui-input" name="currencyCode" placeholder="如 CNY"></label><button class="layui-btn partner-primary-btn">查询</button></form></section>
<section id="summary" class="partner-summary-grid"></section>
<section class="partner-content-card"><div class="partner-card-heading"><div><strong>库存账户</strong><small>库存健康度按可用库存 / 目标库存计算</small></div><span id="count">--</span></div><div class="partner-table-wrap"><table class="partner-table"><thead><tr><th>商户</th><th>游戏 / 币种</th><th>可用库存</th><th>真实 / 目标</th><th>已承诺金额</th><th>健康度</th><th>更新时间</th><th>操作</th></tr></thead><tbody id="body"></tbody></table></div></section>
</main></div><script src="/static/vendor/layui/layui.js"></script><script>
const isPlatform={$identity.role_code == 'platform_admin' ? 'true':'false'},ownChannel={$identity.channel_id};
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const money=v=>Number(v||0).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:4});
const channelName=x=>Number(x.channel_id)===0?'平台默认':(x.show_name||x.agency_uid||('channel '+x.channel_id));
const healthName={healthy:'正常',warning:'预警',danger:'危险',unconfigured:'未配置'};let rows=[];
async function init(){const s=document.getElementById('channelId');if(isPlatform){const p=await fetch('/api/v1/merchants/options').then(r=>r.json());s.innerHTML='<option value="">全部商户</option>'+p.data.map(x=>`<option value="${x.id}">${esc(x.show_name||x.agency_uid)} (#${x.id})</option>`).join('');}else{s.innerHTML=`<option value="${ownChannel}">当前商户 #${ownChannel}</option>`;}load();}
async function load(){const q=new URLSearchParams(new FormData(document.getElementById('filters'))),channel=document.getElementById('channelId').value;if(channel)q.set('channelId',channel);const p=await fetch('/api/v1/inventory/overview?'+q).then(r=>r.json());if(p.code!=='OK')return layui.layer.msg(p.message);rows=p.data;document.getElementById('count').textContent=`共 ${rows.length} 个库存账户`;const total=rows.length,danger=rows.filter(x=>x.health_status==='danger').length,warning=rows.filter(x=>x.health_status==='warning').length;document.getElementById('summary').innerHTML=[['库存账户',total],['危险',danger],['预警',warning]].map(x=>`<article><span>${x[0]}</span><strong>${x[1]}</strong><small>当前筛选范围</small></article>`).join('');document.getElementById('body').innerHTML=rows.length?rows.map((x,i)=>{const committed=Number(x.campaign_available||0)+Number(x.campaign_reserved||0)+Number(x.pending_liability||0),ratio=x.health_ratio==null?'--':(Number(x.health_ratio)*100).toFixed(2)+'%',access=x.inventory_access||{};return `<tr><td>${esc(channelName(x))}<small>#${x.channel_id}</small></td><td><strong>${esc(x.title||x.game_id)}</strong><small>ID ${x.game_id} · ${esc(x.currency_code)}</small></td><td><strong>${money(x.available_reserve)}</strong></td><td>${money(x.cash_reserve)}<small>目标 ${money(x.target_reserve)}</small></td><td>${money(committed)}<small>负债 ${money(x.pending_liability)}</small></td><td><span class="partner-badge ${x.health_status==='healthy'?'ok':'off'}">${healthName[x.health_status]||x.health_status}</span><small>${ratio}</small></td><td>${esc(x.update_time||'-')}</td><td><button class="layui-btn layui-btn-primary layui-btn-xs" onclick="detail(${i})">详情</button>${access.canViewLedger?`<a class="layui-btn layui-btn-primary layui-btn-xs" href="/inventory/ledger?gameId=${x.game_id}&currencyCode=${esc(x.currency_code)}">流水</a>`:''}${access.canAdjust&&Number(x.channel_id)>0?`<button class="layui-btn layui-btn-xs" onclick="adjust(${i})">调整</button>`:''}</td></tr>`}).join(''):'<tr><td colspan="8" class="partner-empty">暂无库存数据</td></tr>';}
function detail(i){const x=rows[i],full=x.inventory_access.visibility==='full';layui.layer.open({type:1,title:`库存详情 · ${esc(x.title||x.game_id)} / ${esc(x.currency_code)}`,area:['760px','620px'],content:`<div class="partner-detail-panel"><div class="partner-detail-row"><b>真实库存</b><span>${money(x.cash_reserve)}</span><b>可用库存</b><span>${money(x.available_reserve)}</span></div><div class="partner-detail-row"><b>目标库存</b><span>${money(x.target_reserve)}</span><b>待结算负债</b><span>${money(x.pending_liability)}</span></div>${full?`<div class="partner-detail-row"><b>活动可用 / 预留</b><span>${money(x.campaign_available)} / ${money(x.campaign_reserved)}</span><b>体验预算 / 已预留</b><span>${money(x.experience_budget)} / ${money(x.assist_reserved)}</span></div><div class="partner-detail-row"><b>已确认利润</b><span>${money(x.realized_profit)}</span><b>本周期投注 / 派彩</b><span>${money(x.period_bet)} / ${money(x.period_payout)}</span></div>`:''}<p>版本 ${x.version} · 更新时间 ${esc(x.update_time)}</p></div>`});}
async function adjust(i){const x=rows[i],a=x.inventory_access,token=await fetch('/api/v1/session').then(r=>r.json()).then(p=>p.data.csrfToken);layui.layer.open({type:1,title:`调整库存 · ${esc(x.title||x.game_id)} / ${esc(x.currency_code)}`,area:['640px','560px'],content:`<form id="adjust-form" class="partner-detail-panel"><div class="partner-inline-alert">当前真实库存 ${money(x.cash_reserve)}。${a.adjustMode==='request'?'提交后由平台管理员审批。':'授权额度内可直接生效，超出额度自动转为审批申请。'}</div><label class="partner-label">调整类型</label><select class="layui-input" name="adjustmentType"><option value="topup">补充库存</option><option value="withdraw">提取库存</option></select><label class="partner-label">金额</label><input class="layui-input" type="number" min="0.0001" step="0.0001" name="amount" required><label class="partner-label">操作原因</label><textarea class="layui-textarea" name="reason" minlength="5" maxlength="255" required></textarea><input type="hidden" name="channelId" value="${x.channel_id}"><input type="hidden" name="gameId" value="${x.game_id}"><input type="hidden" name="currencyCode" value="${esc(x.currency_code)}"><button class="layui-btn partner-primary-btn">提交</button></form>`,success:()=>document.getElementById('adjust-form').addEventListener('submit',async e=>{e.preventDefault();const body=new URLSearchParams(new FormData(e.target));body.set('requestKey',crypto.randomUUID());const p=await fetch('/api/v1/inventory/adjustments',{method:'POST',headers:{'X-CSRF-Token':token},body}).then(r=>r.json());if(p.code!=='OK')return layui.layer.msg(p.message);layui.layer.closeAll();layui.layer.msg(p.message);load();})});}
document.getElementById('filters').addEventListener('submit',e=>{e.preventDefault();load()});init();
</script></body></html>
