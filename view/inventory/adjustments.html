<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>库存调整 - 渠道游戏运营中心</title><link rel="stylesheet" href="/static/vendor/layui/css/layui.css"><link rel="stylesheet" href="/static/css/partner.css"></head><body class="partner-app-page">{include file="common/topbar" /}<div class="partner-app-shell">{include file="common/sidebar" /}<main class="partner-main">
<div class="partner-page-title"><div><p class="partner-eyebrow">INVENTORY ADJUSTMENTS</p><h1>{$identity.role_code == 'platform_admin' ? '库存调整审批' : '库存调整申请'}</h1></div><a class="layui-btn partner-primary-btn" href="/inventory">从库存总览发起调整</a></div>
<section class="partner-content-card partner-filter-card"><form id="filters" class="partner-filter-grid compact"><label>状态<select name="status"><option value="">全部</option><option value="pending">待审批</option><option value="executed">已执行</option><option value="rejected">已拒绝</option><option value="failed">执行失败</option></select></label><button class="layui-btn partner-primary-btn">查询</button></form></section>
<section class="partner-content-card"><div class="partner-card-heading"><div><strong>调整记录</strong><small>直接调整和审批调整统一留痕</small></div><span id="count">--</span></div><div class="partner-table-wrap"><table class="partner-table"><thead><tr><th>申请时间</th><th>商户</th><th>游戏 / 币种</th><th>类型 / 金额</th><th>库存前 / 后</th><th>原因</th><th>状态</th><th>操作</th></tr></thead><tbody id="body"></tbody></table></div><div id="pager" class="partner-pagination"></div></section>
</main></div><script src="/static/vendor/layui/layui.js"></script><script>
const isPlatform={$identity.role_code == 'platform_admin'?'true':'false'},esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])),money=v=>Number(v||0).toLocaleString('zh-CN',{useGrouping:false,minimumFractionDigits:2,maximumFractionDigits:4}),statusNames={pending:'待审批',processing:'执行中',executed:'已执行',rejected:'已拒绝',failed:'执行失败'};
async function token(){return fetch('/api/v1/session').then(r=>r.json()).then(p=>p.data.csrfToken)}
async function load(page=1){const q=new URLSearchParams(new FormData(document.getElementById('filters')));q.set('page',page);q.set('pageSize',20);const p=await fetch('/api/v1/inventory/adjustments?'+q).then(r=>r.json());if(p.code!=='OK')return layui.layer.msg(p.message);document.getElementById('count').textContent=`共 ${p.data.total} 条`;document.getElementById('body').innerHTML=p.data.items.map(x=>`<tr><td>${esc(x.created_at)}<small>${esc(x.requested_name||x.requested_by)}</small></td><td>${esc(x.show_name||('channel '+x.channel_id))}<small>#${x.channel_id}</small></td><td>ID ${x.game_id}<small>${esc(x.currency_code)}</small></td><td>${x.adjustment_type==='topup'?'补充':'提取'}<small>${money(x.amount)}</small></td><td>${x.cash_before==null?'--':money(x.cash_before)}<small>${x.cash_after==null?'--':money(x.cash_after)}</small></td><td>${esc(x.reason)}<small>${esc(x.review_reason||x.runtime_error||'')}</small></td><td><span class="partner-badge ${x.status==='executed'?'ok':'off'}">${statusNames[x.status]||esc(x.status)}</span><small>${esc(x.execution_mode)}</small></td><td>${isPlatform&&x.status==='pending'?`<button class="layui-btn layui-btn-xs" onclick="review(${x.id},true)">批准</button><button class="layui-btn layui-btn-danger layui-btn-xs" onclick="review(${x.id},false)">拒绝</button>`:'--'}</td></tr>`).join('')||'<tr><td colspan="8" class="partner-empty">暂无调整记录</td></tr>';const pages=Math.ceil(p.data.total/p.data.pageSize);document.getElementById('pager').innerHTML=pages>1?`<button ${page<=1?'disabled':''} onclick="load(${page-1})">上一页</button><span>${page} / ${pages}</span><button ${page>=pages?'disabled':''} onclick="load(${page+1})">下一页</button>`:'';}
async function review(id,approve){const csrf=await token();layui.layer.prompt({title:approve?'填写批准说明':'填写拒绝原因',formType:2},async value=>{const p=await fetch(`/api/v1/inventory/adjustments/${id}/${approve?'approve':'reject'}`,{method:'POST',headers:{'X-CSRF-Token':csrf},body:new URLSearchParams({reviewReason:value})}).then(r=>r.json());if(p.code!=='OK')return layui.layer.msg(p.message);layui.layer.closeAll();layui.layer.msg(p.message);load();});}
document.getElementById('filters').addEventListener('submit',e=>{e.preventDefault();load()});load();
</script></body></html>
