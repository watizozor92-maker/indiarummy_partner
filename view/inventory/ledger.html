<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>库存流水 - 渠道游戏运营中心</title><link rel="stylesheet" href="/static/vendor/layui/css/layui.css"><link rel="stylesheet" href="/static/css/partner.css"></head><body class="partner-app-page">{include file="common/topbar" /}<div class="partner-app-shell">{include file="common/sidebar" /}<main class="partner-main">
<div class="partner-page-title"><div><p class="partner-eyebrow">INVENTORY LEDGER</p><h1>库存流水</h1></div><span class="partner-status"><i></i>不可变账本</span></div>
<section class="partner-content-card partner-filter-card"><form id="filters" class="partner-filter-grid"><label>商户<select id="channelId" {$identity.role_code == 'platform_admin' ? '' : 'disabled'}></select></label><label>游戏 ID<input class="layui-input" name="gameId"></label><label>币种<input class="layui-input" name="currencyCode"></label><label>事件<select name="eventType"><option value="">全部事件</option><option value="settle">普通结算</option><option value="campaign_settle">活动结算</option><option value="inventory_adjustment">库存调整</option><option value="period_profit">利润结转</option><option value="period_topup">周期补充</option></select></label><label>开始日期<input class="layui-input" type="date" name="from" value="{$default_from|htmlentities}"></label><label>结束日期<input class="layui-input" type="date" name="to" value="{$default_to|htmlentities}"></label><button class="layui-btn partner-primary-btn">查询</button></form></section>
<section class="partner-content-card"><div class="partner-card-heading"><div><strong>库存变动记录</strong><small>库存变化 = 库存后 - 库存前</small></div><span id="count">--</span></div><div class="partner-table-wrap"><table class="partner-table"><thead><tr><th>时间</th><th>商户</th><th>游戏 / 币种</th><th>事件</th><th>玩家 / 局号</th><th>投注 / 派彩</th><th>库存变化</th><th>库存前 / 后</th></tr></thead><tbody id="body"></tbody></table></div><div id="pager" class="partner-pagination"></div></section>
</main></div><script src="/static/vendor/layui/layui.js"></script><script>
const isPlatform={$identity.role_code == 'platform_admin'?'true':'false'},ownChannel={$identity.channel_id},esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])),money=v=>Number(v||0).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:4}),eventNames={settle:'普通结算',campaign_settle:'活动结算',inventory_adjustment:'库存调整',period_profit:'利润结转',period_topup:'周期补充',period_rollover:'周期结转',admin_cash_set:'管理员设置',control_reset:'控制重置'};
async function init(){const s=document.getElementById('channelId');if(isPlatform){const p=await fetch('/api/v1/merchants/options').then(r=>r.json());s.innerHTML='<option value="">全部商户</option>'+p.data.map(x=>`<option value="${x.id}">${esc(x.show_name||x.agency_uid)} (#${x.id})</option>`).join('');}else{s.innerHTML=`<option value="${ownChannel}">当前商户 #${ownChannel}</option>`;}const u=new URLSearchParams(location.search);for(const k of ['gameId','currencyCode'])if(u.get(k))document.querySelector(`[name="${k}"]`).value=u.get(k);load();}
async function load(page=1){const q=new URLSearchParams(new FormData(document.getElementById('filters'))),channel=document.getElementById('channelId').value;if(channel)q.set('channelId',channel);q.set('page',page);q.set('pageSize',20);const p=await fetch('/api/v1/inventory/ledger?'+q).then(r=>r.json());if(p.code!=='OK')return layui.layer.msg(p.message);document.getElementById('count').textContent=`共 ${p.data.total} 条`;document.getElementById('body').innerHTML=p.data.items.map(x=>`<tr><td>${esc(x.create_time)}</td><td>${esc(x.show_name||x.agency_uid||('channel '+x.channel_id))}</td><td>${esc(x.title||x.game_id)}<small>ID ${x.game_id} · ${esc(x.currency_code)}</small></td><td>${esc(eventNames[x.event_type]||x.event_type)}</td><td>${x.uid||'-'}<small>#${x.round_id}</small></td><td>${money(x.bet)} / ${money(x.payout)}</td><td class="${Number(x.cash_change)>0?'partner-positive':Number(x.cash_change)<0?'partner-negative':'partner-neutral'}">${Number(x.cash_change)>0?'+':''}${money(x.cash_change)}</td><td>${money(x.cash_before)}<small>${money(x.cash_after)}</small></td></tr>`).join('')||'<tr><td colspan="8" class="partner-empty">暂无流水</td></tr>';const pages=Math.ceil(p.data.total/p.data.pageSize);document.getElementById('pager').innerHTML=pages>1?`<button ${page<=1?'disabled':''} onclick="load(${page-1})">上一页</button><span>${page} / ${pages}</span><button ${page>=pages?'disabled':''} onclick="load(${page+1})">下一页</button>`:'';}
document.getElementById('filters').addEventListener('submit',e=>{e.preventDefault();load()});init();
</script></body></html>
