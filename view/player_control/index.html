<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>玩家调控 - 渠道游戏运营中心</title><link rel="stylesheet" href="/static/vendor/layui/css/layui.css"><link rel="stylesheet" href="/static/css/partner.css"></head>
<body class="partner-app-page">{include file="common/topbar" /}<div class="partner-app-shell">{include file="common/sidebar" /}<main class="partner-main">
  <div class="partner-page-title"><div><p class="partner-eyebrow">PLAYER CONTROL</p><h1>玩家调控</h1></div><div><button class="layui-btn layui-btn-primary" type="button" onclick="exportTasks()">导出 CSV</button> <button id="create-button" class="layui-btn partner-primary-btn" type="button">新建调控任务</button></div></div>
  <div class="partner-inline-alert">任务按商户、UID、游戏和币种隔离；达到目标金额、最大局数或到期时间后自动停止。实际结果仍受库存、最大赔付和玩法完整性约束。</div>
  <div id="summary" class="partner-metric-grid"></div>
  <section class="partner-content-card partner-filter-card"><form id="filters" class="partner-filter-grid compact"><label>商户<select id="channelId" name="channelId" class="layui-select"></select></label><label>UID<input class="layui-input" name="uid"></label><label>游戏 ID<input class="layui-input" name="gameId"></label><label>币种<input class="layui-input" name="currencyCode"></label><label>状态<select name="state"><option value="">全部</option><option value="ACTIVE">进行中</option><option value="COMPLETED">已完成</option><option value="CANCELED">已取消</option><option value="EXPIRED">已到期</option></select></label><label>模式<select name="mode"><option value="">全部</option><option value="SUPPORT">扶持</option><option value="SUPPRESS">收割</option><option value="RTP_TARGET">目标 RTP</option></select></label><button class="layui-btn partner-primary-btn">查询</button></form></section>
  <section class="partner-content-card"><div class="partner-card-heading"><div><strong>调控任务</strong><small>目标、实际与加载状态</small></div><span id="count">--</span></div><div class="partner-table-wrap"><table class="partner-table"><thead><tr><th>玩家 / 商户</th><th>游戏 / 币种</th><th>模式</th><th>目标</th><th>实际进度</th><th>局数</th><th>有效期</th><th>状态</th><th>操作</th></tr></thead><tbody id="body"></tbody></table></div><div id="pagination" class="partner-pagination"></div></section>
</main></div><script src="/static/vendor/layui/layui.js"></script><script>
const isPlatform={$identity.role_code == 'platform_admin' ? 'true' : 'false'},canManage={$identity.role_code == 'merchant_viewer' ? 'false' : 'true'},ownChannel={$identity.channel_id};
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])),money=v=>Number(v||0).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:4}),pct=v=>v==null?'--':(Number(v)*100).toFixed(2)+'%';
let games=[],currencies=[],csrfToken='';
const modeName={SUPPORT:'扶持',SUPPRESS:'收割',RTP_TARGET:'目标 RTP'},stateName={ACTIVE:'进行中',COMPLETED:'已完成',CANCELED:'已取消',EXPIRED:'已到期'};
async function init(){
  const session=await fetch('/api/v1/session').then(r=>r.json());csrfToken=session.data.csrfToken;
  const select=document.getElementById('channelId');if(isPlatform){const p=await fetch('/api/v1/merchants/options').then(r=>r.json());select.innerHTML='<option value="">全部商户</option>'+p.data.map(x=>`<option value="${x.id}">${esc(x.show_name||x.agency_uid)} (#${x.id})</option>`).join('');}else{select.innerHTML=`<option value="${ownChannel}">当前商户 #${ownChannel}</option>`;select.disabled=true;}
  await loadControlOptions(isPlatform?'':ownChannel);select.addEventListener('change',()=>loadControlOptions(select.value));
  if(!canManage)document.getElementById('create-button').style.display='none';load(1);
}
async function loadControlOptions(channel){const q=channel?`?channelId=${encodeURIComponent(channel)}`:'';const p=await fetch('/api/v1/player-control/options'+q).then(r=>r.json());if(p.code==='OK'){games=p.data.games||[];currencies=p.data.currencies||[];}}
async function load(page=1){const q=new URLSearchParams(new FormData(document.getElementById('filters')));if(!isPlatform)q.set('channelId',ownChannel);q.set('page',page);q.set('pageSize',20);const p=await fetch('/api/v1/player-control?'+q).then(r=>r.json()),body=document.getElementById('body');if(p.code!=='OK'){body.innerHTML=`<tr><td colspan="9" class="partner-empty partner-error">${esc(p.message)}</td></tr>`;return;}const s=p.data.summary;document.getElementById('summary').innerHTML=[['进行中',s.ACTIVE],['已完成',s.COMPLETED],['已取消',s.CANCELED],['已到期',s.EXPIRED]].map(x=>`<article><span>${x[0]}</span><strong>${x[1]}</strong><small>玩家调控任务</small></article>`).join('');document.getElementById('count').textContent=`共 ${p.data.total} 条`;body.innerHTML=p.data.items.length?p.data.items.map(x=>`<tr><td><strong>${x.uid}</strong><small>${esc(x.playername||'-')} · channel ${x.channel_id}</small></td><td><strong>${esc(x.title||x.game_id)}</strong><small>${esc(x.currency_code)}</small></td><td><span class="partner-badge ${x.control_mode==='SUPPORT'?'ok':'off'}">${modeName[x.control_mode]||esc(x.control_mode)}</span><small>${x.target_rtp?pct(x.target_rtp):''}</small></td><td>${money(x.target_amount)}</td><td>${money(x.progress.amount)}<small>实际 RTP ${pct(x.progress.actualRtp)}</small></td><td>${x.completed_rounds} / ${x.max_rounds}</td><td>${new Date(Number(x.start_at)*1000).toLocaleString()}<small>至 ${new Date(Number(x.end_at)*1000).toLocaleString()}</small></td><td><span class="partner-badge ${x.state==='ACTIVE'?'ok':'off'}">${stateName[x.state]||esc(x.state)}</span><small>${esc(x.load_status)} ${esc(x.load_error||'')}</small></td><td><button class="layui-btn layui-btn-primary layui-btn-xs" onclick="detail(${x.control_id},${x.channel_id})">数据/记录</button>${canManage&&x.state==='ACTIVE'?`<button class="layui-btn layui-btn-danger layui-btn-xs" onclick="cancelTask(${x.control_id},${x.channel_id})">取消</button>`:''}</td></tr>`).join(''):'<tr><td colspan="9" class="partner-empty">暂无调控任务</td></tr>';const pages=Math.ceil(p.data.total/p.data.pageSize);document.getElementById('pagination').innerHTML=pages>1?`<button ${page<=1?'disabled':''} onclick="load(${page-1})">上一页</button><span>${page} / ${pages}</span><button ${page>=pages?'disabled':''} onclick="load(${page+1})">下一页</button>`:'';}
async function createTask(){const channel=isPlatform?document.getElementById('channelId').value:ownChannel;if(!channel)return layui.layer.msg('请先在筛选区选择商户');await loadControlOptions(channel);if(!currencies.length)return layui.layer.msg('该商户尚未启用币种');const now=new Date(),end=new Date(Date.now()+7*86400000),local=d=>new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16),gameOptions=games.map(x=>`<option value="${x.game_id}">${esc(x.title||x.game_id)} (#${x.game_id})</option>`).join(''),currencyOptions=currencies.map(x=>`<option value="${esc(x.currency_code)}">${esc(x.currency_code)}${Number(x.is_default)===1?'（默认）':''}</option>`).join('');layui.layer.open({type:1,title:'新建玩家调控任务',area:['720px','720px'],content:`<form id="create-form" class="partner-detail-panel"><input type="hidden" name="channelId" value="${channel}"><label class="partner-label">玩家 UID</label><input class="layui-input" name="uid" required><label class="partner-label">游戏</label><select class="layui-input" name="gameId">${gameOptions}</select><label class="partner-label">币种</label><select class="layui-input" name="currencyCode">${currencyOptions}</select><label class="partner-label">模式</label><select id="mode" class="layui-input" name="mode"><option value="SUPPORT">扶持玩家</option><option value="SUPPRESS">收割玩家</option><option value="RTP_TARGET">目标 RTP</option></select><label class="partner-label">目标金额（累计净赢/净亏绝对值）</label><input class="layui-input" type="number" min="0.0001" step="0.0001" name="targetAmount" required><label class="partner-label">目标 RTP（仅目标 RTP 模式，例如 0.92）</label><input class="layui-input" type="number" min="0.1" max="2" step="0.0001" name="targetRtp"><label class="partner-label">最大局数</label><input class="layui-input" type="number" min="1" max="10000" name="maxRounds" value="100" required><div class="partner-detail-row"><label>开始时间<input class="layui-input" type="datetime-local" name="startAt" value="${local(now)}" required></label><label>结束时间<input class="layui-input" type="datetime-local" name="endAt" value="${local(end)}" required></label></div><label class="partner-label">操作原因</label><textarea class="layui-textarea" name="reason" minlength="5" required></textarea><button class="layui-btn partner-primary-btn" type="submit">创建并加载</button></form>`,success:()=>document.getElementById('create-form').addEventListener('submit',async e=>{e.preventDefault();const r=await fetch('/api/v1/player-control',{method:'POST',headers:{'X-CSRF-Token':csrfToken},body:new URLSearchParams(new FormData(e.target))}).then(x=>x.json());if(r.code!=='OK')return layui.layer.msg(r.message);csrfToken=r.data.csrfToken;layui.layer.closeAll();layui.layer.msg(r.message);load(1);})});}
async function detail(id,channel){const p=await fetch(`/api/v1/player-control/${id}?channelId=${channel}`).then(r=>r.json());if(p.code!=='OK')return layui.layer.msg(p.message);const x=p.data;layui.layer.open({type:1,title:`玩家调控 #${id}`,area:['900px','680px'],content:`<div class="partner-detail-panel"><div class="partner-detail-row"><b>玩家</b><span>${x.uid} ${esc(x.playername||'')}</span><b>模式</b><span>${modeName[x.control_mode]}</span></div><div class="partner-detail-row"><b>累计投注</b><span>${money(x.total_bet)}</span><b>累计派彩</b><span>${money(x.total_payout)}</span></div><h4>逐局记录</h4>${x.events.length?x.events.map(e=>`<div class="partner-detail-row"><b>#${e.round_id}</b><span>投注 ${money(e.bet)}</span><span>派彩 ${money(e.payout)}</span><span>累计 ${money(e.accumulated_amount)} · ${esc(e.state_after)}</span></div>`).join(''):'<p>暂无执行记录</p>'}</div>`});}
function cancelTask(id,channel){layui.layer.prompt({title:'请输入取消原因（至少 5 个字符）',formType:2},async value=>{const r=await fetch(`/api/v1/player-control/${id}/cancel`,{method:'POST',headers:{'X-CSRF-Token':csrfToken},body:new URLSearchParams({channelId:channel,reason:value})}).then(x=>x.json());if(r.code!=='OK')return layui.layer.msg(r.message);csrfToken=r.data.csrfToken;layui.layer.closeAll();layui.layer.msg('任务已取消');load(1);});}
function exportTasks(){const q=new URLSearchParams(new FormData(document.getElementById('filters')));if(!isPlatform)q.set('channelId',ownChannel);window.location.href='/api/v1/player-control-export?'+q;}
document.getElementById('filters').addEventListener('submit',e=>{e.preventDefault();load(1)});document.getElementById('create-button').addEventListener('click',createTask);init();
</script></body></html>
