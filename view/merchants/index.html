<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>商户管理 - 渠道游戏运营中心</title>
  <link rel="stylesheet" href="/static/vendor/layui/css/layui.css"><link rel="stylesheet" href="/static/css/partner.css">
</head>
<body class="partner-app-page">
{include file="common/topbar" /}
<div class="partner-app-shell">{include file="common/sidebar" /}<main class="partner-main">
  <div class="partner-page-title"><div><p class="partner-eyebrow">MERCHANTS</p><h1>商户管理</h1></div><div><span class="partner-status"><i></i>API 密钥脱敏</span> <button id="create-merchant" class="layui-btn partner-primary-btn" type="button">新增商户</button></div></div>
  <section class="partner-content-card partner-filter-card"><form id="merchant-filter" class="partner-filter-grid compact"><label>名称 / 编码<input class="layui-input" name="keyword"></label><label>状态<select name="status"><option value="">全部</option><option value="1">启用</option><option value="0">停用</option></select></label><button class="layui-btn partner-primary-btn" type="submit">查询</button></form></section>
  <section class="partner-content-card">
    <div class="partner-card-heading"><div><strong>合作渠道</strong><small>来自 d_channel_parter</small></div><span id="merchant-count">--</span></div>
    <div class="partner-table-wrap"><table class="partner-table"><thead><tr><th>ID / 商户</th><th>默认币种</th><th>玩家数</th><th>额度</th><th>已使用</th><th>API 密钥</th><th>状态</th><th>操作</th></tr></thead><tbody id="merchant-body"></tbody></table></div>
  </section>
</main></div>
<script src="/static/vendor/layui/layui.js"></script>
<script>
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const money=v=>Number(v||0).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:4});
const limit=v=>Number(v)<0?'无限':money(v);
let csrfToken='';
function bindCurrencyChoices(form){
  const boxes=[...form.querySelectorAll('input[name="currencyCodes[]"]')],radios=[...form.querySelectorAll('input[name="defaultCurrency"]')];
  radios.forEach(radio=>radio.addEventListener('change',()=>{const box=boxes.find(x=>x.value===radio.value);if(box)box.checked=true;}));
  boxes.forEach(box=>box.addEventListener('change',()=>{if(!box.checked){const radio=radios.find(x=>x.value===box.value);if(radio&&radio.checked)radio.checked=false;}}));
}
async function load(){
  const q=new URLSearchParams(new FormData(document.getElementById('merchant-filter'))),body=document.getElementById('merchant-body');
  const p=await fetch('/api/v1/merchants?'+q).then(r=>r.json());
  if(p.code!=='OK'){body.innerHTML=`<tr><td colspan="8" class="partner-empty partner-error">${esc(p.message)}</td></tr>`;return;}
  document.getElementById('merchant-count').textContent=`共 ${p.data.total} 个`;
  body.innerHTML=p.data.items.map(x=>`<tr><td><strong>#${x.id} ${esc(x.show_name||'-')}</strong><small>${esc(x.agency_uid||'-')}</small></td><td>${esc(x.currency_code||'-')}</td><td>${x.user_count}</td><td>信用 ${limit(x.credit_limit)}<small>采购 ${limit(x.purchase_limit)}</small></td><td>${money(x.used_coin)}</td><td><code>${esc(x.api_key_masked||'未设置')}</code></td><td><span class="partner-badge ${Number(x.status)===1?'ok':'off'}">${Number(x.status)===1?'启用':'停用'}</span></td><td><button class="layui-btn layui-btn-primary layui-btn-xs" onclick="detail(${x.id})">详情</button><button class="layui-btn layui-btn-primary layui-btn-xs" onclick="editMerchant(${x.id})">编辑</button><button class="layui-btn layui-btn-primary layui-btn-xs" onclick="currencies(${x.id})">币种</button><button class="layui-btn layui-btn-primary layui-btn-xs" onclick="controlGrants(${x.id})">调控授权</button><a class="layui-btn layui-btn-primary layui-btn-xs" href="/inventory/grants?channelId=${x.id}">库存授权</a><button class="layui-btn layui-btn-primary layui-btn-xs" onclick="security(${x.id})">白名单</button></td></tr>`).join('');
}
async function detail(id){
  const p=await fetch('/api/v1/merchants/'+id).then(r=>r.json());if(p.code!=='OK')return layui.layer.msg(p.message);const x=p.data;
  layui.layer.open({type:1,title:`商户 #${id}`,area:['760px','620px'],content:`<div class="partner-detail-panel"><h3>${esc(x.show_name||x.agency_uid)}</h3><div class="partner-detail-row"><b>商户编码</b><span>${esc(x.agency_uid)}</span><b>玩家数</b><span>${x.user_count}</span></div><div class="partner-detail-row"><b>联系电话</b><span>${esc(x.phone||'-')}</span><b>社交账号</b><span>${esc(x.social_code||'-')}</span></div><div class="partner-detail-row"><b>返点</b><span>${money(x.back_rate)}%</span><b>状态</b><span>${Number(x.status)===1?'启用':'停用'}</span></div><div class="partner-detail-row"><b>信用额度</b><span>${limit(x.credit_limit)}</span><b>采购额度</b><span>${limit(x.purchase_limit)}</span></div><div class="partner-detail-row"><b>API 密钥</b><span><code>${esc(x.api_key_masked||'未设置')}</code></span></div><h4>授权币种</h4>${x.currencies.length?x.currencies.map(c=>`<div class="partner-detail-row"><b>${esc(c.currency_code)}</b><span>${esc(c.currency_name||'')}</span><span>${Number(c.is_default)===1?'默认币种':''}</span><span>${Number(c.status)===1?'启用':'停用'}</span></div>`).join(''):'<p>暂无币种映射</p>'}</div>`});
}
async function editMerchant(id){
  const [merchant,session]=await Promise.all([fetch('/api/v1/merchants/'+id).then(r=>r.json()),fetch('/api/v1/session').then(r=>r.json())]);
  if(merchant.code!=='OK'||session.code!=='OK')return layui.layer.msg(merchant.message||session.message);const x=merchant.data,token=session.data.csrfToken;
  layui.layer.open({type:1,title:`编辑商户 #${id}`,area:['720px','730px'],content:`<form id="merchant-edit-form" class="partner-detail-panel"><div class="partner-inline-alert">商户编码和 API Key 不可在此修改；币种请使用独立的“币种”功能管理。</div><label class="partner-label">商户编码</label><input class="layui-input" value="${esc(x.agency_uid)}" disabled><label class="partner-label">商户名称</label><input class="layui-input" name="showName" minlength="2" maxlength="32" value="${esc(x.show_name||'')}" required><div class="partner-detail-row partner-form-pair"><label>返点<input class="layui-input" type="number" name="backRate" min="0" max="100" step="0.01" value="${Number(x.back_rate||0)}" required></label><label>联系电话<input class="layui-input" name="phone" maxlength="20" value="${esc(x.phone||'')}"></label></div><label class="partner-label">社交账号</label><input class="layui-input" name="socialCode" maxlength="20" value="${esc(x.social_code||'')}"><label class="partner-label"><span class="partner-field-label">当前信用分（used_coin） <small>实时值，仅展示</small></span></label><input class="layui-input" value="${money(x.used_coin)}" readonly><div class="partner-detail-row partner-form-pair"><label><span class="partner-field-label">信用额度 <small>设置 -1 表示无限额度</small></span><input class="layui-input" type="number" name="creditLimit" min="-1" step="1" value="${Number(x.credit_limit||0)}" required></label><label><span class="partner-field-label">采购额度 <small>设置 -1 表示无限额度</small></span><input class="layui-input" type="number" name="purchaseLimit" min="-1" step="1" value="${Number(x.purchase_limit||0)}" required></label></div><label class="partner-label">商户状态</label><select class="layui-input" name="status"><option value="1" ${Number(x.status)===1?'selected':''}>启用</option><option value="0" ${Number(x.status)!==1?'selected':''}>停用</option></select><div class="partner-inline-alert">停用商户会同步停用该商户的后台账号，并立即阻止游戏服务继续使用其额度。</div><button class="layui-btn partner-primary-btn" type="submit">保存商户信息</button></form>`,success:()=>document.getElementById('merchant-edit-form').addEventListener('submit',async e=>{e.preventDefault();const submit=e.target.querySelector('[type="submit"]');submit.disabled=true;const r=await fetch(`/api/v1/merchants/${id}`,{method:'PUT',headers:{'X-CSRF-Token':token},body:new URLSearchParams(new FormData(e.target))}).then(x=>x.json()).catch(()=>({code:'NETWORK_ERROR',message:'网络请求失败'}));submit.disabled=false;if(r.code!=='OK'&&r.code!=='RUNTIME_LOAD_FAILED')return layui.layer.msg(r.message);layui.layer.closeAll();layui.layer.msg(r.message);load();})});
}
async function createMerchant(){
  const [options,session]=await Promise.all([fetch('/api/v1/merchants/currency-options').then(r=>r.json()),fetch('/api/v1/session').then(r=>r.json())]);
  if(options.code!=='OK'||session.code!=='OK')return layui.layer.msg(options.message||session.message);csrfToken=session.data.csrfToken;
  const currencies=options.data||[],defaultCode=(currencies.find(x=>x.currency_code==='CNY')||currencies[0]||{}).currency_code||'';
  const rows=currencies.map(x=>`<label class="partner-detail-row"><span><input type="checkbox" name="currencyCodes[]" value="${esc(x.currency_code)}" ${['CNY','USD'].includes(x.currency_code)?'checked':''}> <b>${esc(x.currency_code)}</b> ${esc(x.currency_name||'')}</span><span>${esc(x.symbol||'')} · ${Number(x.decimal_places||0)} 位小数</span><span>默认 <input type="radio" name="defaultCurrency" value="${esc(x.currency_code)}" ${x.currency_code===defaultCode?'checked':''}></span></label>`).join('')||'<p class="partner-empty">系统币种目录中暂无已启用币种</p>';
  layui.layer.open({type:1,title:'新增合作商户',area:['760px','860px'],content:`<form id="merchant-create-form" class="partner-detail-panel"><div class="partner-inline-alert">API Key 和商户后台账号将自动生成；初始密码由平台管理员设置。创建结果中的敏感信息只显示一次，请立即安全保存。</div><label class="partner-label">商户编码</label><input class="layui-input" name="agencyUid" minlength="3" maxlength="32" placeholder="例如 agency10001" required><label class="partner-label">商户名称</label><input class="layui-input" name="showName" minlength="2" maxlength="32" required><div class="partner-detail-row partner-form-pair"><label>返点<input class="layui-input" type="number" name="backRate" min="0" max="100" step="0.01" value="0"></label><label>联系电话<input class="layui-input" name="phone" maxlength="20"></label></div><label class="partner-label">社交账号</label><input class="layui-input" name="socialCode" maxlength="20"><div class="partner-detail-row partner-form-pair"><label><span class="partner-field-label">信用额度 <small>设置 -1 表示无限额度</small></span><input class="layui-input" type="number" name="creditLimit" min="-1" step="1" value="0" required></label><label><span class="partner-field-label">采购额度 <small>设置 -1 表示无限额度</small></span><input class="layui-input" type="number" name="purchaseLimit" min="-1" step="1" value="0" required></label></div><label class="partner-label">商户后台登录 IP / CIDR</label><input class="layui-input" name="adminIpRule" placeholder="例如 203.0.113.10/32" required><small>创建时同步生成商户管理员账号和初始登录白名单。</small><div class="partner-detail-row partner-form-pair"><label>后台初始密码<input class="layui-input" type="password" name="adminPassword" minlength="12" maxlength="128" autocomplete="new-password" required></label><label>确认初始密码<input class="layui-input" type="password" name="adminPasswordConfirmation" minlength="12" maxlength="128" autocomplete="new-password" required></label></div><small>至少 12 位，必须包含大小写字母、数字和特殊符号。</small><label class="partner-detail-row"><span><b>立即启用</b></span><input type="checkbox" name="status" value="1" checked></label><h4>币种授权</h4><div class="partner-inline-alert">选项从系统币种目录实时读取。新商户默认授权 CNY、USD，也可勾选其它币种；默认币种必须同时获得授权。</div>${rows}<button class="layui-btn partner-primary-btn" type="submit" ${currencies.length?'':'disabled'}>创建商户及后台账号</button></form>`,success:()=>{const createForm=document.getElementById('merchant-create-form');bindCurrencyChoices(createForm);createForm.addEventListener('submit',async e=>{e.preventDefault();const form=new FormData(e.target);if(form.get('adminPassword')!==form.get('adminPasswordConfirmation'))return layui.layer.msg('两次输入的后台密码不一致');const body=new URLSearchParams();for(const [key,value] of form.entries())body.append(key,value);if(!form.has('status'))body.set('status','0');const submit=e.target.querySelector('[type="submit"]');submit.disabled=true;const r=await fetch('/api/v1/merchants',{method:'POST',headers:{'X-CSRF-Token':csrfToken},body}).then(x=>x.json()).catch(()=>({code:'NETWORK_ERROR',message:'网络请求失败'}));submit.disabled=false;if(r.code!=='OK')return layui.layer.msg(r.message);csrfToken=r.data.csrfToken;layui.layer.closeAll();showCreatedMerchant(r.data);load();});}});
}
function showCreatedMerchant(data){
  const loginUrl=location.origin+'/login',credentials=`后台地址：${loginUrl}\n登录账号：${data.adminUsername}\n初始密码：${data.adminPassword}\n允许 IP：${data.adminIpRule}\nAPI Key：${data.apiKey}`;
  layui.layer.open({type:1,title:'商户及后台账号创建成功',area:['720px','650px'],content:`<div class="partner-detail-panel"><div class="partner-inline-alert">以下登录密码和 API Key 只显示一次。关闭窗口前请复制并通过安全渠道交付商户，首次登录后应立即修改密码。</div><div class="partner-detail-row"><b>商户 ID</b><span>#${data.channelId}</span><b>商户编码</b><span>${esc(data.agencyUid)}</span></div><div class="partner-detail-row"><b>后台登录账号</b><span>${esc(data.adminUsername)}</span><b>允许登录 IP</b><span>${esc(data.adminIpRule)}</span></div><label class="partner-label">初始密码</label><input id="new-admin-password" class="layui-input" readonly value="${esc(data.adminPassword)}"><label class="partner-label">API Key</label><textarea id="new-api-key" class="layui-textarea" readonly>${esc(data.apiKey)}</textarea><textarea id="new-merchant-credentials" style="position:absolute;left:-9999px">${esc(credentials)}</textarea><button class="layui-btn partner-primary-btn" type="button" onclick="navigator.clipboard.writeText(document.getElementById('new-merchant-credentials').value).then(()=>layui.layer.msg('登录信息和 API Key 已复制'))">复制全部信息</button><p>后台登录地址：<a href="${esc(loginUrl)}" target="_blank">${esc(loginUrl)}</a></p></div>`});
}
async function currencies(id){
  const [merchant,options,session]=await Promise.all([fetch('/api/v1/merchants/'+id).then(r=>r.json()),fetch('/api/v1/merchants/currency-options').then(r=>r.json()),fetch('/api/v1/session').then(r=>r.json())]);
  if(merchant.code!=='OK'||options.code!=='OK')return layui.layer.msg(merchant.message||options.message);
  const enabled=new Set(merchant.data.currencies.filter(x=>Number(x.status)===1).map(x=>x.currency_code)),currentDefault=(merchant.data.currencies.find(x=>Number(x.is_default)===1&&Number(x.status)===1)||{}).currency_code||'';
  const rows=options.data.map(x=>`<label class="partner-detail-row"><span><input type="checkbox" name="currencyCodes[]" value="${esc(x.currency_code)}" ${enabled.has(x.currency_code)?'checked':''}> <b>${esc(x.currency_code)}</b> ${esc(x.currency_name||'')}</span><span>${esc(x.symbol||'')} · ${Number(x.decimal_places||0)} 位小数</span><span>默认 <input type="radio" name="defaultCurrency" value="${esc(x.currency_code)}" ${currentDefault===x.currency_code?'checked':''}></span></label>`).join('');
  layui.layer.open({type:1,title:`商户 #${id} 币种授权`,area:['700px','600px'],content:`<form id="currency-form" class="partner-detail-panel"><div class="partner-inline-alert">授权选项来自系统币种目录；保存后该商户才能使用对应币种。调控策略按渠道与游戏共享，库存和统计仍按币种隔离。</div>${rows}<button class="layui-btn partner-primary-btn" type="submit">保存币种授权</button></form>`,success:()=>{const currencyForm=document.getElementById('currency-form');bindCurrencyChoices(currencyForm);currencyForm.addEventListener('submit',async e=>{e.preventDefault();const form=new FormData(e.target),body=new URLSearchParams();form.getAll('currencyCodes[]').forEach(x=>body.append('currencyCodes[]',x));body.set('defaultCurrency',form.get('defaultCurrency')||'');const r=await fetch(`/api/v1/merchants/${id}/currencies`,{method:'PUT',headers:{'X-CSRF-Token':session.data.csrfToken},body}).then(x=>x.json());if(r.code!=='OK')return layui.layer.msg(r.message);layui.layer.closeAll();layui.layer.msg('币种授权已更新');load();});}});
}
async function controlGrants(id){
  const [grants,session]=await Promise.all([fetch(`/api/v1/merchants/${id}/control-grants`).then(r=>r.json()),fetch('/api/v1/session').then(r=>r.json())]);
  if(grants.code!=='OK')return layui.layer.msg(grants.message);
  let token=session.data.csrfToken;const presets=grants.data.presets||[],scopes=new Map((grants.data.scopes||[]).map(x=>[Number(x.game_id),x])),games=new Map();
  presets.forEach((x,index)=>{x._index=index;if(!games.has(Number(x.game_id)))games.set(Number(x.game_id),[]);games.get(Number(x.game_id)).push(x)});
  const pct=v=>(Number(v||0)*100).toFixed(2).replace(/\.00$/,'');
  const rows=[...games.entries()].map(([gameId,items])=>{const s=scopes.get(gameId)||{},title=items[0]?.title||gameId;return `<section class="partner-content-card" style="margin:0 0 14px"><div class="partner-card-heading"><div><strong>${esc(title)}</strong><small>游戏 ID ${gameId}</small></div><span>${items.filter(x=>Number(x.status)===1).length}/${items.length} 个方案</span></div><div>${items.map(x=>`<label class="partner-detail-row"><span><input type="checkbox" data-grant-index="${x._index}" ${Number(x.status)===1?'checked':''}> <b>${esc(x.preset_name)}</b></span><span>RTP ${x.target_rtp==null?'-':pct(x.target_rtp)+'%'}</span><span>中奖率 ${x.hit_rate==null?'-':pct(x.hit_rate)+'%'}</span><span>${esc(x.description||'')}</span></label>`).join('')}</div><form class="control-scope-form" data-game-id="${gameId}"><h4>自定义目标与历史操作授权</h4><div class="partner-detail-row partner-form-pair"><label>RTP 范围（%）<div style="display:flex;gap:8px"><input class="layui-input" type="number" name="rtpMin" step="0.01" value="${pct(s.rtp_min)}"><input class="layui-input" type="number" name="rtpMax" step="0.01" value="${pct(s.rtp_max)}"><input class="layui-input" type="number" name="rtpStep" step="0.01" value="${pct(s.rtp_step)}"></div><small>最小 / 最大 / 步长</small></label><label>中奖率范围（%）<div style="display:flex;gap:8px"><input class="layui-input" type="number" name="hitMin" step="0.01" value="${pct(s.hit_min)}"><input class="layui-input" type="number" name="hitMax" step="0.01" value="${pct(s.hit_max)}"><input class="layui-input" type="number" name="hitStep" step="0.01" value="${pct(s.hit_step)}"></div><small>最小 / 最大 / 步长</small></label></div><div class="partner-detail-row"><label><input type="checkbox" name="allowCustom" value="1" ${Number(s.allow_custom)===1?'checked':''}> 允许商户自定义目标</label><label><input type="checkbox" name="allowRollback" value="1" ${Number(s.allow_rollback)===1?'checked':''}> 允许回滚及恢复平台默认</label><label><input type="checkbox" name="status" value="1" ${Number(s.status)===1?'checked':''}> 授权范围生效</label><button class="layui-btn layui-btn-sm partner-primary-btn" type="submit">保存范围</button></div></form></section>`}).join('');
  layui.layer.open({type:1,title:`商户 #${id} 游戏调控授权`,area:['1020px','820px'],content:`<div class="partner-detail-panel"><div class="partner-inline-alert">预设方案和自定义目标分别授权。自定义目标只会匹配已授权且已校准的最近可达方案；关闭授权不会改写当前已加载配置。</div>${rows||'<p>暂无可授权方案</p>'}</div>`,success:()=>{
    document.querySelectorAll('[data-grant-index]').forEach(input=>input.addEventListener('change',async event=>{const x=presets[Number(event.target.dataset.grantIndex)],body=new URLSearchParams({presetKey:x.preset_key,status:event.target.checked?'1':'0'});event.target.disabled=true;const result=await fetch(`/api/v1/merchants/${id}/games/${x.game_id}/control-grant`,{method:'PUT',headers:{'X-CSRF-Token':token},body}).then(r=>r.json());event.target.disabled=false;if(result.code!=='OK'){event.target.checked=!event.target.checked;return layui.layer.msg(result.message);}token=result.data.csrfToken;layui.layer.msg('预设授权已更新');}));
    document.querySelectorAll('.control-scope-form').forEach(form=>form.addEventListener('submit',async event=>{event.preventDefault();const body=new URLSearchParams(new FormData(form));for(const key of ['allowCustom','allowRollback','status'])if(!body.has(key))body.set(key,'0');const button=form.querySelector('button');button.disabled=true;const result=await fetch(`/api/v1/merchants/${id}/games/${form.dataset.gameId}/control-scope`,{method:'PUT',headers:{'X-CSRF-Token':token},body}).then(r=>r.json());button.disabled=false;if(result.code!=='OK')return layui.layer.msg(result.message);token=result.data.csrfToken;layui.layer.msg('调控范围已更新');}));
  }});
}
async function security(id){
  const [rules,session]=await Promise.all([fetch(`/api/v1/merchants/${id}/ip-whitelist`).then(r=>r.json()),fetch('/api/v1/session').then(r=>r.json())]);if(rules.code!=='OK')return layui.layer.msg(rules.message);const token=session.data.csrfToken;
  layui.layer.open({type:1,title:`商户 #${id} 后台 IP 白名单`,area:['760px','620px'],content:`<div class="partner-detail-panel"><div id="rules">${renderRules(rules.data)}</div><h4>新增规则</h4><form id="rule-form"><div class="partner-detail-row"><b>IP / CIDR</b><input class="layui-input" name="ipOrCidr" placeholder="203.0.113.10/32"><b>备注</b><input class="layui-input" name="remark"></div><button class="layui-btn partner-primary-btn" type="submit">新增</button></form></div>`,success:()=>document.getElementById('rule-form').addEventListener('submit',async e=>{e.preventDefault();const r=await fetch(`/api/v1/merchants/${id}/ip-whitelist`,{method:'POST',headers:{'X-CSRF-Token':token},body:new URLSearchParams(new FormData(e.target))}).then(x=>x.json());if(r.code!=='OK')return layui.layer.msg(r.message);layui.layer.closeAll();security(id);})});
}
function renderRules(rows){return rows.length?rows.map(x=>`<div class="partner-detail-row"><b>${esc(x.ip_or_cidr)}</b><span>${esc(x.remark||'-')}</span><span><span class="partner-badge ${Number(x.status)===1?'ok':'off'}">${Number(x.status)===1?'启用':'停用'}</span></span><span>${esc(x.updated_at)}</span></div>`).join(''):'<p>暂无规则。创建后台账号前必须先配置至少一条规则。</p>';}
document.getElementById('merchant-filter').addEventListener('submit',e=>{e.preventDefault();load()});document.getElementById('create-merchant').addEventListener('click',createMerchant);load();
</script>
</body></html>
