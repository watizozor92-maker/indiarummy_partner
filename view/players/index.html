<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>玩家管理 - 渠道游戏运营中心</title><link rel="stylesheet" href="/static/vendor/layui/css/layui.css"><link rel="stylesheet" href="/static/css/partner.css"></head><body class="partner-app-page">{include file="common/topbar" /}<div class="partner-app-shell">{include file="common/sidebar" /}<main class="partner-main">
<div class="partner-page-title"><div><p class="partner-eyebrow">PLAYERS</p><h1>玩家管理</h1></div><span class="partner-status"><i></i>服务端租户隔离</span></div>
<section class="partner-content-card partner-filter-card"><form id="player-filter" class="partner-filter-grid"><label>商户<select id="channelId" name="channelId" class="layui-select" {if $identity.role_code != 'platform_admin'}disabled{/if}><option value="">{if $identity.role_code == 'platform_admin'}请选择商户{else}当前商户{/if}</option></select></label><label>UID / 玩家名称<input class="layui-input" name="keyword" placeholder="输入 UID 或名称"></label><label>开始日期<input class="layui-input" type="date" name="from" value="{$default_from|htmlentities}"></label><label>结束日期<input class="layui-input" type="date" name="to" value="{$default_to|htmlentities}"></label><label>币种<input class="layui-input" name="currencyCode" placeholder="如 INR"></label><button class="layui-btn partner-primary-btn" type="submit">查询</button></form></section>
<section class="partner-content-card"><div class="partner-card-heading"><div><strong>玩家列表</strong><small>周期统计按币种独立展示，输赢为玩家视角</small></div><div><button class="layui-btn layui-btn-primary layui-btn-sm" type="button" onclick="exportPlayers()">导出 CSV</button> <span id="player-count">--</span></div></div><div class="partner-table-wrap"><table class="partner-table player-data-table"><thead><tr><th>UID / 玩家</th><th>余额</th><th>状态</th><th>周期币种数据</th><th>最后活跃</th><th>操作</th></tr></thead><tbody id="player-body"><tr><td colspan="6" class="partner-empty">请选择条件并查询</td></tr></tbody></table></div><div id="player-pagination" class="partner-pagination"></div></section>
</main></div><style>.player-data-table td{font-size:15px}.player-data-table td strong,.player-data-table .partner-stat-line{font-size:16px}.detail-metrics{margin:14px 0}.detail-metrics article strong{font-size:22px}.analytics-chart{height:300px;margin-top:12px}</style><script src="/static/vendor/layui/layui.js"></script><script src="/static/vendor/echarts/echarts.min.js"></script><script>
const isPlatform={$identity.role_code == 'platform_admin' ? 'true' : 'false'}, ownChannel={$identity.channel_id};let currentPage=1;const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const money=v=>Number(v||0).toLocaleString('zh-CN',{useGrouping:false,minimumFractionDigits:2,maximumFractionDigits:4});const profitClass=v=>Number(v)>0?'partner-positive':Number(v)<0?'partner-negative':'partner-neutral';const playerWinLoss=v=>-Number(v||0);
async function initChannels(){const s=document.getElementById('channelId');if(!isPlatform){s.innerHTML=`<option value="${ownChannel}">channel ${ownChannel}</option>`;return;}const p=await fetch('/api/v1/merchants/options').then(r=>r.json());if(p.code==='OK')s.innerHTML='<option value="">请选择商户</option>'+p.data.map(x=>`<option value="${x.id}">${esc(x.show_name||x.agency_uid)} (#${x.id})</option>`).join('');}
async function loadPlayers(page=1){const form=new FormData(document.getElementById('player-filter')),q=new URLSearchParams();form.forEach((v,k)=>{if(v)q.set(k,v)});if(!isPlatform)q.set('channelId',ownChannel);q.set('page',page);q.set('pageSize',20);const body=document.getElementById('player-body');body.innerHTML='<tr><td colspan="6" class="partner-empty">加载中…</td></tr>';const p=await fetch('/api/v1/players?'+q).then(r=>r.json());if(p.code!=='OK'){body.innerHTML=`<tr><td colspan="6" class="partner-empty partner-error">${esc(p.message)}</td></tr>`;return;}currentPage=page;document.getElementById('player-count').textContent=`共 ${p.data.total} 人`;body.innerHTML=p.data.items.length?p.data.items.map(x=>`<tr><td><strong>${x.uid}</strong><small>${esc(x.playername||'-')}</small></td><td>${money(x.coin)}</td><td><span class="partner-badge ${Number(x.status)===1?'ok':'off'}">${Number(x.status)===1?'正常':'停用'}</span></td><td>${x.period_stats.length?x.period_stats.map(s=>{const winLoss=playerWinLoss(s.profit_amount);return `<div class="partner-stat-line"><b>${esc(s.currency_code)}</b> 投注 ${money(s.bet_amount)} / 派彩 ${money(s.payout_amount)} / 用户输赢 <span class="${profitClass(winLoss)}">${money(winLoss)}</span></div>`}).join(''):'--'}</td><td>${esc(x.login_time?new Date(x.login_time*1000).toLocaleString():'--')}</td><td><button class="layui-btn layui-btn-primary layui-btn-xs" onclick="showPlayer(${x.uid})">详情</button></td></tr>`).join(''):'<tr><td colspan="6" class="partner-empty">没有符合条件的玩家</td></tr>';renderPager(p.data.total,page,p.data.pageSize);}
function exportPlayers(){const q=new URLSearchParams(new FormData(document.getElementById('player-filter')));if(!isPlatform)q.set('channelId',ownChannel);if(isPlatform&&!q.get('channelId'))return layui.layer.msg('请选择商户');window.location.href='/api/v1/players-export?'+q;}
function renderPager(total,page,size){const pages=Math.ceil(total/size),el=document.getElementById('player-pagination');el.innerHTML=pages>1?`<button ${page<=1?'disabled':''} onclick="loadPlayers(${page-1})">上一页</button><span>${page} / ${pages}</span><button ${page>=pages?'disabled':''} onclick="loadPlayers(${page+1})">下一页</button>`:'';}
function analyticsOption(rows,currency){const data=rows.filter(x=>x.currency_code===currency),dates=data.map(x=>x.stat_date);return {tooltip:{trigger:'axis'},legend:{data:['投注','派彩','用户输赢']},grid:{left:72,right:24,top:45,bottom:48},xAxis:{type:'category',data:dates,axisLabel:{rotate:dates.length>10?35:0}},yAxis:{type:'value'},series:[{name:'投注',type:'bar',data:data.map(x=>Number(x.bet_amount)),itemStyle:{color:'#2563eb'}},{name:'派彩',type:'bar',data:data.map(x=>Number(x.payout_amount)),itemStyle:{color:'#f59e0b'}},{name:'用户输赢',type:'bar',data:data.map(x=>{const winLoss=playerWinLoss(x.profit_amount);return {value:winLoss,itemStyle:{color:winLoss>0?'#087b62':winLoss<0?'#b42318':'#111827'}}})}]};}
async function showPlayer(uid){const channel=isPlatform?document.getElementById('channelId').value:ownChannel;if(!channel)return layui.layer.msg('请先选择商户');const form=new FormData(document.getElementById('player-filter')),q=new URLSearchParams({channelId:channel});for(const key of ['from','to','currencyCode']){const value=form.get(key);if(value)q.set(key,value)}const p=await fetch(`/api/v1/players/${uid}?${q}`).then(r=>r.json());if(p.code!=='OK')return layui.layer.msg(p.message);const x=p.data,codes=[...new Set(x.statistics.map(s=>s.currency_code))],selected=codes[0]||'';layui.layer.open({type:1,title:`玩家 ${uid}`,area:['900px','780px'],content:`<div class="partner-detail-panel"><h3>${esc(x.playername||'未命名')}</h3><p>余额：${money(x.coin)}　状态：${Number(x.status)===1?'正常':'停用'}　统计周期：${esc(x.analytics_meta.from.slice(0,10))} 至 ${esc(x.analytics_meta.to.slice(0,10))}</p><div class="partner-metric-grid detail-metrics">${x.statistics.map(s=>{const winLoss=playerWinLoss(s.profit_amount);return `<article><span>${esc(s.currency_code)} 用户输赢</span><strong class="${profitClass(winLoss)}">${money(winLoss)}</strong><small>投注 ${money(s.bet_amount)} / 派彩 ${money(s.payout_amount)} / ${s.spin_count} 局</small></article>`}).join('')||'<article><span>当前周期</span><strong>--</strong><small>暂无数据</small></article>'}</div><div class="partner-card-heading"><div><strong>每日输赢分析</strong><small>玩家视角：派彩减投注；正数为玩家赢</small></div>${codes.length?`<select id="player-chart-currency" class="layui-select">${codes.map(c=>`<option>${esc(c)}</option>`).join('')}</select>`:''}</div><div id="player-analytics-chart" class="analytics-chart"></div><h4>按游戏</h4>${x.games.map(g=>{const winLoss=playerWinLoss(g.profit_amount);return `<div class="partner-detail-row"><b>${esc(g.title||g.game_id)}</b><span>${esc(g.currency_code)}</span><span>${g.spin_count} 局</span><span class="${profitClass(winLoss)}">用户输赢 ${money(winLoss)}</span></div>`}).join('')||'<p>当前周期暂无游戏记录</p>'}</div>`,success:()=>{const chart=echarts.init(document.getElementById('player-analytics-chart'));if(selected)chart.setOption(analyticsOption(x.daily_trend,selected));else chart.setOption({title:{text:'当前周期暂无数据',left:'center',top:'middle'}});const select=document.getElementById('player-chart-currency');if(select)select.addEventListener('change',()=>chart.setOption(analyticsOption(x.daily_trend,select.value),true));window.addEventListener('resize',()=>chart.resize(),{once:true});}});}
document.getElementById('player-filter').addEventListener('submit',e=>{e.preventDefault();if(isPlatform&&!document.getElementById('channelId').value)return layui.layer.msg('请选择商户');loadPlayers(1)});initChannels().then(()=>{if(!isPlatform)loadPlayers(1)});
</script></body></html>
