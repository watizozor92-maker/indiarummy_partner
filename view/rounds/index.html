<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>游戏记录 - 渠道游戏运营中心</title><link rel="stylesheet" href="/static/vendor/layui/css/layui.css"><link rel="stylesheet" href="/static/css/partner.css"></head><body class="partner-app-page">{include file="common/topbar" /}<div class="partner-app-shell">{include file="common/sidebar" /}<main class="partner-main">
<div class="partner-page-title"><div><p class="partner-eyebrow">ROUNDS</p><h1>游戏记录</h1></div><span class="partner-status"><i></i>渠道与币种快照</span></div><section class="partner-content-card partner-filter-card"><form id="round-filter" class="partner-filter-grid"><label>商户<select id="channelId" name="channelId" class="layui-select"><option value="">全部商户</option></select></label><label>UID<input class="layui-input" name="uid"></label><label>局号<input class="layui-input" name="roundId"></label><label>游戏 ID<input class="layui-input" name="gameId"></label><label>币种<input class="layui-input" name="currencyCode"></label><label>开始日期<input class="layui-input" type="date" name="from" value="{$default_from|htmlentities}"></label><label>结束日期<input class="layui-input" type="date" name="to" value="{$default_to|htmlentities}"></label><button class="layui-btn partner-primary-btn" type="submit">查询</button></form></section>
<section class="partner-content-card"><div class="partner-card-heading"><div><strong>账本记录</strong><small>稳定按 create_time + id 倒序</small></div><div><button class="layui-btn layui-btn-primary layui-btn-sm" type="button" onclick="exportRounds()">导出 CSV</button> <span id="round-count">--</span></div></div><div class="partner-table-wrap"><table class="partner-table"><thead><tr><th>时间 / 局号</th><th>玩家</th><th>游戏</th><th>币种</th><th>投注</th><th>派彩</th><th>利润</th><th>倍数</th><th>场景 / 模式</th><th>操作</th></tr></thead><tbody id="round-body"></tbody></table></div><div id="round-pagination" class="partner-pagination"></div></section>
</main></div><script src="/static/vendor/layui/layui.js"></script><script>
const isPlatform={$identity.role_code == 'platform_admin' ? 'true' : 'false'},ownChannel={$identity.channel_id};const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const money=v=>Number(v||0).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:4});const profitClass=v=>Number(v)>0?'partner-positive':Number(v)<0?'partner-negative':'partner-neutral';
async function init(){const s=document.getElementById('channelId');if(!isPlatform){s.innerHTML=`<option value="${ownChannel}">channel ${ownChannel}</option>`;s.disabled=true;}else{const p=await fetch('/api/v1/merchants/options').then(r=>r.json());if(p.code==='OK')s.innerHTML='<option value="">全部商户</option>'+p.data.map(x=>`<option value="${x.id}">${esc(x.show_name||x.agency_uid)} (#${x.id})</option>`).join('');}loadRounds(1);}
async function loadRounds(page){const q=new URLSearchParams(new FormData(document.getElementById('round-filter')));if(!isPlatform)q.set('channelId',ownChannel);q.set('page',page);q.set('pageSize',20);const body=document.getElementById('round-body');body.innerHTML='<tr><td colspan="10" class="partner-empty">加载中…</td></tr>';const p=await fetch('/api/v1/rounds?'+q).then(r=>r.json());if(p.code!=='OK'){body.innerHTML=`<tr><td colspan="10" class="partner-empty partner-error">${esc(p.message)}</td></tr>`;return;}document.getElementById('round-count').textContent=`共 ${p.data.total} 条`;body.innerHTML=p.data.items.length?p.data.items.map(x=>`<tr><td>${esc(x.create_time)}<small>#${x.round_id}</small></td><td>${x.uid}<small>${esc(x.playername||'-')}</small></td><td>${esc(x.title||x.game_id)}<small>ID ${x.game_id}</small></td><td><b>${esc(x.currency_code)}</b></td><td>${money(x.bet)}</td><td>${money(x.payout)}</td><td class="${profitClass(x.profit)}">${money(x.profit)}</td><td>${x.win_multiplier===null?'--':Number(x.win_multiplier).toFixed(2)+'x'}</td><td>${esc(x.scene_name||'-')}<small>${esc(x.mode_name||'-')}</small></td><td><button class="layui-btn layui-btn-primary layui-btn-xs" onclick="detail(${x.id},${x.channel_id})">详情</button></td></tr>`).join(''):'<tr><td colspan="10" class="partner-empty">没有符合条件的记录</td></tr>';const pages=Math.ceil(p.data.total/p.data.pageSize);document.getElementById('round-pagination').innerHTML=pages>1?`<button ${page<=1?'disabled':''} onclick="loadRounds(${page-1})">上一页</button><span>${page} / ${pages}</span><button ${page>=pages?'disabled':''} onclick="loadRounds(${page+1})">下一页</button>`:'';}
function exportRounds(){const q=new URLSearchParams(new FormData(document.getElementById('round-filter')));if(!isPlatform)q.set('channelId',ownChannel);window.location.href='/api/v1/rounds-export?'+q;}
async function detail(id,channel){const p=await fetch(`/api/v1/rounds/${id}?channelId=${channel}`).then(r=>r.json());if(p.code!=='OK')return layui.layer.msg(p.message);const x=p.data;layui.layer.open({type:1,title:`记录 #${x.round_id}`,area:['760px','600px'],content:`<div class="partner-detail-panel"><div class="partner-detail-row"><b>游戏</b><span>${esc(x.title||x.game_id)}</span><b>玩家</b><span>${x.uid}</span></div><div class="partner-detail-row"><b>投注</b><span>${money(x.bet)} ${esc(x.currency_code)}</span><b>派彩</b><span>${money(x.payout)} ${esc(x.currency_code)}</span></div><h4>事件详情</h4><pre class="partner-json">${esc(JSON.stringify(x.detail||{},null,2))}</pre></div>`});}
document.getElementById('round-filter').addEventListener('submit',e=>{e.preventDefault();loadRounds(1)});init();
</script></body></html>
