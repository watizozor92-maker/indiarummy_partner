<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>运营总览 - 渠道游戏运营中心</title><link rel="stylesheet" href="/static/vendor/layui/css/layui.css"><link rel="stylesheet" href="/static/css/partner.css"></head>
<body class="partner-app-page">{include file="common/topbar" /}<div class="partner-app-shell">{include file="common/sidebar" /}<main class="partner-main">
<div class="partner-page-title"><div><p class="partner-eyebrow">OVERVIEW</p><h1>运营总览</h1></div><span class="partner-status"><i></i>实时账本数据</span></div>
<div id="overview-alert" class="partner-inline-alert" hidden></div><div id="overview-currencies" class="partner-currency-tabs"></div>
<div class="partner-metric-grid"><article><span>平台利润</span><strong id="metric-profit">--</strong><small>投注 - 派彩</small></article><article><span>投注金额</span><strong id="metric-bet">--</strong><small id="metric-players">-- 位活跃玩家</small></article><article><span>派彩金额</span><strong id="metric-payout">--</strong><small id="metric-spins">-- 局</small></article><article><span>实际 RTP</span><strong id="metric-rtp">--</strong><small id="metric-hit">派彩局命中率 --</small></article></div>
<section class="partner-content-card"><div class="partner-card-heading"><div><strong>近 7 天趋势</strong><small>投注、派彩与平台利润</small></div><span id="overview-meta">加载中…</span></div><div id="overview-chart" class="partner-chart-placeholder"></div></section>
</main></div><script src="/static/vendor/layui/layui.js"></script><script src="/static/vendor/echarts/echarts.min.js"></script><script>
const chart=echarts.init(document.getElementById('overview-chart'));let overviewData=null;const money=v=>Number(v||0).toLocaleString('zh-CN',{useGrouping:false,minimumFractionDigits:2,maximumFractionDigits:4});const percent=v=>v===null||v===undefined?'--':(Number(v)*100).toFixed(2)+'%';const profitClass=v=>Number(v)>0?'partner-positive':Number(v)<0?'partner-negative':'partner-neutral';const profitColor=v=>Number(v)>0?'#087b62':Number(v)<0?'#b42318':'#111827';
function renderOverview(currency){const s=overviewData.summary.find(x=>x.currencyCode===currency)||{},profit=document.getElementById('metric-profit');profit.textContent=money(s.profitAmount)+' '+currency;profit.className=profitClass(s.profitAmount);document.getElementById('metric-bet').textContent=money(s.betAmount)+' '+currency;document.getElementById('metric-payout').textContent=money(s.payoutAmount)+' '+currency;document.getElementById('metric-rtp').textContent=percent(s.actualRtp);document.getElementById('metric-players').textContent=(s.playerCount||0)+' 位活跃玩家';document.getElementById('metric-spins').textContent=(s.spinCount||0).toLocaleString()+' 局';document.getElementById('metric-hit').textContent='派彩局命中率 '+percent(s.payoutHitRate);document.querySelectorAll('.partner-currency-tabs button').forEach(b=>b.classList.toggle('active',b.dataset.currency===currency));const rows=overviewData.trend.filter(x=>x.currency_code===currency);chart.setOption({grid:{left:64,right:28,top:34,bottom:58},tooltip:{trigger:'axis'},legend:{data:['投注','派彩','利润']},xAxis:{type:'category',data:rows.map(x=>x.stat_date),axisLine:{lineStyle:{color:'#d9e2ef'}}},yAxis:{type:'value',splitLine:{lineStyle:{color:'#edf2f7'}}},series:[{name:'投注',type:'bar',data:rows.map(x=>Number(x.bet_amount)),itemStyle:{color:'#2357d8',borderRadius:[4,4,0,0]}},{name:'派彩',type:'line',data:rows.map(x=>Number(x.payout_amount)),smooth:true,itemStyle:{color:'#f59e0b'}},{name:'利润',type:'line',data:rows.map(x=>({value:Number(x.profit_amount),itemStyle:{color:profitColor(x.profit_amount)}})),smooth:true,lineStyle:{color:'#344054'}}]});}
fetch('/api/v1/overview').then(r=>r.json()).then(p=>{if(p.code!=='OK')throw new Error(p.message||'加载失败');overviewData=p.data;if(!overviewData.summary.length){const a=document.getElementById('overview-alert');a.hidden=false;a.textContent='当前统计周期没有游戏记录';chart.clear();return;}const tabs=document.getElementById('overview-currencies');tabs.innerHTML=overviewData.summary.map(x=>`<button type="button" data-currency="${x.currencyCode}">${x.currencyCode}</button>`).join('');tabs.addEventListener('click',e=>{if(e.target.dataset.currency)renderOverview(e.target.dataset.currency)});document.getElementById('overview-meta').textContent=`${overviewData.meta.timezone} · ${overviewData.meta.from.slice(0,10)} 至 ${overviewData.meta.to.slice(0,10)}`;renderOverview(overviewData.summary[0].currencyCode)}).catch(e=>{const a=document.getElementById('overview-alert');a.hidden=false;a.textContent=e.message});window.addEventListener('resize',()=>chart.resize());
</script></body></html>
