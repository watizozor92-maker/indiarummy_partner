<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>操作审计 - 渠道游戏运营中心</title><link rel="stylesheet" href="/static/vendor/layui/css/layui.css"><link rel="stylesheet" href="/static/css/partner.css"></head><body class="partner-app-page">{include file="common/topbar" /}<div class="partner-app-shell">{include file="common/sidebar" /}<main class="partner-main"><div class="partner-page-title"><div><p class="partner-eyebrow">AUDIT</p><h1>操作审计</h1></div><span class="partner-status"><i></i>不可含密码或完整密钥</span></div><section class="partner-content-card partner-filter-card"><form id="filters" class="partner-filter-grid compact"><label>动作前缀<input class="layui-input" name="action" placeholder="如 auth."></label><button class="layui-btn partner-primary-btn">查询</button></form></section><section class="partner-content-card"><div class="partner-card-heading"><div><strong>审计日志</strong><small>商户角色只能查看自己的操作</small></div><span id="count">--</span></div><div class="partner-table-wrap"><table class="partner-table"><thead><tr><th>时间</th><th>操作者 / 渠道</th><th>动作</th><th>资源</th><th>结果</th><th>原因</th><th>来源 IP</th><th>Request ID</th></tr></thead><tbody id="body"></tbody></table></div></section></main></div><script src="/static/vendor/layui/layui.js"></script><script>
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));async function load(){const q=new URLSearchParams(new FormData(document.getElementById('filters'))),p=await fetch('/api/v1/audit-logs?'+q).then(r=>r.json());if(p.code!=='OK')return layui.layer.msg(p.message);document.getElementById('count').textContent=`共 ${p.data.total} 条`;document.getElementById('body').innerHTML=p.data.items.map(x=>`<tr><td>${esc(x.created_at)}</td><td>#${x.actor_id}<small>channel ${x.channel_id} · ${esc(x.role_code)}</small></td><td><strong>${esc(x.action)}</strong></td><td>${esc(x.resource_type||'-')}<small>${esc(x.resource_id||'')}</small></td><td><span class="partner-badge ${x.result==='success'?'ok':'off'}">${esc(x.result)}</span></td><td>${esc(x.reason||'-')}</td><td>${esc(x.ip_address)}</td><td><code>${esc(x.request_id||'-')}</code></td></tr>`).join('')||'<tr><td colspan="8" class="partner-empty">暂无审计日志</td></tr>';}document.getElementById('filters').addEventListener('submit',e=>{e.preventDefault();load()});load();
</script></body></html>
